services:
  mongo:
    image: mongo:7
    # Single-node replica set: change streams and transactions need one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    # WiredTiger keeps a file per collection and index. The default 1024 open-file limit ran out in tests.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
volumes:
  mongodata:
