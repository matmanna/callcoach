AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Stewardship Copilot. S3 + CloudFront for the web app, Lambda (Function URL) for the API behind /api/*.

# Region: us-east-2 (the project's assigned Region; Lambda and S3 must live there). The CloudFront certificate
# is created separately in us-east-1, which CloudFront requires, and passed in as CertificateArn.
# One secret holds the runtime secrets as JSON: { "MONGODB_URI", "BETTER_AUTH_SECRET", "ORIGIN_VERIFY" }.
# Create it with infra/secrets.sh. Values are never in git.

Parameters:
  DomainName:
    Type: String
    Default: callcoach.matmanna.dev
  CertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 covering DomainName (validated through Cloudflare DNS).
  SecretName:
    Type: String
    Default: callcoach/prod
  BedrockModelId:
    Type: String
    Default: ""
  InviteLinkInResponse:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: No email service yet, so coordinators copy invite links from the app.

Conditions:
  HasModel: !Not [!Equals [!Ref BedrockModelId, ""]]

Resources:
  # ---------------- API (Lambda + Function URL) ----------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      CodeUri: build/api/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --enable-source-maps
          MONGODB_URI: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:MONGODB_URI}}"
          BETTER_AUTH_SECRET: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:BETTER_AUTH_SECRET}}"
          ORIGIN_VERIFY: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:ORIGIN_VERIFY}}"
          BETTER_AUTH_URL: !Sub https://${DomainName}
          APP_ORIGIN: !Sub https://${DomainName}
          MAIL_MODE: console
          INVITE_LINK_IN_RESPONSE: !Ref InviteLinkInResponse
          MONGO_MAX_POOL: "5"
          BEDROCK_MODEL_ID: !If [HasModel, !Ref BedrockModelId, ""]
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      # AuthType NONE: CloudFront OAC cannot sign browser POST bodies. The handler instead requires
      # the X-Origin-Verify header that CloudFront adds, so direct hits to the URL get a 403.
      FunctionUrlConfig:
        AuthType: NONE

  # ---------------- Web (S3 + CloudFront) ----------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Single-page app: any path without a file extension serves index.html. Done in a viewer-request
  # function (not custom error pages) so API 404s are never rewritten into HTML.
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === "/" || uri.endsWith("/") || uri.indexOf(".") === -1) request.uri = "/index.html";
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName}
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            # Function URL looks like https://<id>.lambda-url.<region>.on.aws/ ; the origin needs the host only.
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:ORIGIN_VERIFY}}"
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Description: Point the Cloudflare CNAME for the domain here (DNS only, not proxied).
    Value: !GetAtt Distribution.DomainName
  WebBucketName:
    Value: !Ref WebBucket
  ApiFunctionName:
    Value: !Ref ApiFunction
